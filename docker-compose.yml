version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_dashboard
    restart: always
    environment:
      POSTGRES_USER: seu_usuario
      POSTGRES_PASSWORD: senha12345
      POSTGRES_DB: dashboard_financeiro
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
